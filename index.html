<style>
:root{--ink:#102236;--muted:#536174;--paper:#f7f9fc;--line:#d7dfe9;--accent:#f4a44b;--blue:#225d92}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}a:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:5px}.skip{position:absolute;left:1rem;top:-5rem;background:white;padding:1rem;z-index:4}.skip:focus{top:1rem}.wrap{max-width:1160px;margin:auto;padding:0 32px}header{border-bottom:1px solid var(--line);background:#fff}nav{min-height:88px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{text-decoration:none;font-weight:750;letter-spacing:-.03em;font-size:1.2rem}.brand span{color:var(--blue)}.links{display:flex;gap:28px;flex-wrap:wrap}.links a{text-decoration:none;font-size:.95rem}.links a:hover{text-decoration:underline}.hero{background:var(--ink);color:#fff;padding:72px 0 58px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.875rem;font-weight:650;color:#98acc3;margin:0 0 22px}h1{font-size:clamp(2.5rem,6vw,4.7rem);letter-spacing:-.055em;line-height:1.07;margin:0 0 24px;max-width:860px;font-weight:650}.hero h1 span{color:var(--accent)}.intro{font-size:1.2rem;max-width:690px;color:#ced8e5;margin:0 0 30px}.hero-bottom{display:flex;justify-content:space-between;gap:30px;align-items:end;border-top:1px solid #34475b;padding-top:27px}.hero-bottom p{margin:0;color:#b8c8d9;font-size:.95rem}.hero-bottom a{color:var(--accent);text-underline-offset:5px}main{min-height:55vh}.section{padding-top:56px;padding-bottom:56px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:25px}h2{font-size:2rem;line-height:1.2;letter-spacing:-.035em;margin:0 0 16px}.section-head h2{margin:0}.small{font-size:.9rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.card{background:white;border:1px solid var(--line);padding:30px;display:flex;flex-direction:column;position:relative;text-decoration:none;transition:border-color .15s,transform .15s}.card:hover{border-color:var(--blue);transform:translateY(-3px)}.card:first-child{border-top:4px solid var(--accent)}.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;color:var(--muted);font-size:.875rem}.number{font-variant-numeric:tabular-nums;letter-spacing:.05em;color:var(--blue)}.card h3{font-size:1.65rem;font-weight:650;letter-spacing:-.03em;line-height:1.25;margin:25px 0 15px}.card p{color:var(--muted);margin:0 0 25px}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}.tag{background:#edf2f8;padding:4px 10px;font-size:.875rem}.card-bottom{margin-top:27px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:16px;font-size:.9rem}.card-bottom strong{font-weight:600;color:var(--blue)}.about{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:45px}.about p{margin:0 0 16px;max-width:720px;color:var(--muted)}.about a{color:var(--blue);text-underline-offset:4px}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.9rem}.footer-row{display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}.back{display:inline-block;margin:30px 0 28px;color:var(--blue);text-underline-offset:5px}.detail-head{background:white;border:1px solid var(--line);border-top:4px solid var(--accent);padding:40px}.detail-head h1{font-size:clamp(2.1rem,5vw,3.5rem);margin-top:18px}.detail-head p{max-width:790px;color:var(--muted);font-size:1.15rem}.detail-columns{display:grid;grid-template-columns:1.8fr 1fr;gap:48px;padding:42px 0 60px}.detail-columns h2{font-size:1.5rem}.work{padding-left:23px;margin:0}.work li{padding-left:5px;margin-bottom:17px}.note{background:#eaf0f7;padding:24px}.note p{margin:0;color:var(--muted)}.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:30px}figure{margin:0}figure img{width:100%;display:block;border:1px solid var(--line)}figcaption{font-size:.9rem;color:var(--muted);padding-top:8px}video,iframe{width:100%;aspect-ratio:16/9;background:var(--ink);border:0}.file-list{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 45px}.file-list a{padding:10px 17px;border:1px solid var(--line);background:white;text-underline-offset:3px}.error{padding:70px 0}.empty-media{padding-bottom:38px;color:var(--muted)}@media(max-width:700px){.wrap{padding:0 21px}nav{padding:20px 0;align-items:start;flex-direction:column;gap:12px}.links{gap:22px}.hero{padding:45px 0 35px}.hero-bottom{flex-direction:column;align-items:start;gap:12px}.section{padding-top:36px;padding-bottom:36px}.grid,.about,.detail-columns,.media{grid-template-columns:1fr}.card{padding:24px}.section-head{align-items:start;flex-direction:column;gap:8px}.about{gap:12px}.detail-head{padding:25px}.detail-columns{gap:24px;padding-top:30px}.card-bottom{flex-direction:column;gap:6px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.card{transition:none}.card:hover{transform:none}}

<body>
<a class="skip" href="#main">Skip to content</a>
<header><nav class="wrap" aria-label="Main navigation"><a class="brand" href="#">Shubham Jadhav<span>.</span></a><div class="links"><a href="#projects">Projects</a><a href="#about">About</a><a href="https://www.linkedin.com/in/shubham~jadhav/" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="https://github.com/jadhavshubham560" target="_blank" rel="noopener noreferrer">GitHub</a></div></nav></header>
<main id="main"><div class="wrap error" role="status">Loading projects…</div></main>
<footer><div class="wrap footer-row"><span>Shubham Jadhav · Mechanical engineering portfolio</span><a href="https://www.linkedin.com/in/shubham~jadhav/">Connect on LinkedIn</a></div></footer>
<script>
'use strict';
const main = document.getElementById('main');
let projects = [];
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const tags = p => p.tools.map(t => `<span class="tag">${esc(t)}</span>`).join('');
function safeUrl(value) {
  if (!value || typeof value !== 'string') return '';
  try { const url = new URL(value, location.href); return ['https:','http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function home() {
  document.title = 'Shubham Jadhav | Mechanical engineering portfolio';
  main.innerHTML = `<section class="hero"><div class="wrap"><p class="eyebrow">Mechanical engineering portfolio</p><h1>Shubham Jadhav<span>.</span><br>Design. Build. Test.</h1><p class="intro">I’m a mechanical engineer studying for my M.Eng. at Technische Hochschule Brandenburg. These projects cover mechanical design, material selection, robotics and embedded systems.</p><div class="hero-bottom"><p>SolidWorks · Ansys Granta · Robotics</p><a href="#projects">Explore my projects</a></div></div></section><section id="projects" class="wrap section"><div class="section-head"><h2>Engineering projects</h2><span class="small">${projects.length} projects · 2026</span></div><div class="grid">${projects.map((p,i) => `<a class="card" href="#project/${encodeURIComponent(p.id)}"><div class="card-top"><span>${esc(p.category)}</span><span class="number">${String(i+1).padStart(2,'0')}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="tags">${tags(p)}</div><div class="card-bottom"><span>${esc(p.period)}</span><strong>View project</strong></div></a>`).join('')}</div></section><section id="about" class="wrap section about"><h2>About me</h2><div><p>I’m an early-career mechanical engineer with a background in industrial engineering. My interests include product development, CAD, testing and validation.</p><p>I’m completing an M.Eng. in Mechanical Engineering at Technische Hochschule Brandenburg, following an M.Sc. in Industrial Engineering and International Management at Hochschule Fresenius.</p><a href="https://www.linkedin.com/in/shubham~jadhav/" target="_blank" rel="noopener noreferrer">See my experience and education on LinkedIn</a></div></section>`;
}
function detail(p) {
  document.title = `${p.title} | Shubham Jadhav`;
  const images = (p.images || []).map(image => {const url=safeUrl(image.src); return url ? `<figure><img src="${esc(url)}" alt="${esc(image.alt || p.title)}" loading="lazy">${image.caption ? `<figcaption>${esc(image.caption)}</figcaption>` : ''}</figure>` : '';}).join('');
  const url=safeUrl(p.video);
  let video='';
  if(url) {
    const parsed=new URL(url);
    if(['www.youtube.com','youtube.com','www.youtube-nocookie.com'].includes(parsed.hostname) && /^\/embed\/[a-zA-Z0-9_-]+$/.test(parsed.pathname)) video=`<iframe src="${esc(url)}" title="${esc(p.title)} demonstration" loading="lazy" allowfullscreen></iframe>`;
    else if(/\.mp4$/i.test(parsed.pathname)) video=`<video controls preload="metadata"><source src="${esc(url)}" type="video/mp4">Your browser does not support this video. <a href="${esc(url)}">Open the video</a>.</video>`;
    else video=`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Watch project demonstration</a>`;
  }
  const files=(p.files || []).map(file=>{const url=safeUrl(file.url);return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(file.label)}</a>`:'';}).join('');
  main.innerHTML=`<div class="wrap"><a class="back" href="#projects">All projects</a><article><div class="detail-head"><span class="small">${esc(p.category)} · ${esc(p.period)}</span><h1>${esc(p.title)}</h1><p>${esc(p.summary)}</p><div class="tags">${tags(p)}</div></div><div class="detail-columns"><section><h2>Project work</h2><ul class="work">${p.work.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></section><aside class="note"><h2>Engineering focus</h2><p>${esc(p.focus)}</p></aside></div>${images || video || files ? `<section><h2>Project material</h2>${images ? `<div class="media">${images}</div>`:''}${video}${files ? `<div class="file-list">${files}</div>`:''}</section>` : '<p class="empty-media">Project videos, drawings and supporting files will be added here.</p>'}</article></div>`;
}
function route() {
  if(location.hash.startsWith('#project/')) {
    const id=location.hash.slice(9);
    const p=projects.find(p=>encodeURIComponent(p.id)===id);
    if(p) detail(p); else {document.title='Project not found | Shubham Jadhav';main.innerHTML='<div class="wrap error"><h1>Project not found</h1><a href="#projects">Return to projects</a></div>';}
    window.scrollTo(0,0);
  } else {
    home();
    if(['#projects','#about'].includes(location.hash)) document.querySelector(location.hash).scrollIntoView();
    else window.scrollTo(0,0);
  }
}
fetch('projects.json').then(response=>{if(!response.ok)throw new Error('Projects unavailable');return response.json();}).then(data=>{if(!Array.isArray(data))throw new Error('Invalid project data');projects=data;route();window.addEventListener('hashchange',route);}).catch(()=>{main.innerHTML='<div class="wrap error"><h1>Projects are unavailable right now.</h1><p>Please try again later, or visit <a href="https://www.linkedin.com/in/shubham~jadhav/">my LinkedIn profile</a>.</p></div>';});
</script>
</body>
</html>
