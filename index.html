<title>Shubham Jadhav | Mechanical engineering portfolio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23102236'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-weight='700' font-size='18' fill='%23f4a44b'%3ESJ%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#edf0ef;--muted:#a3acab;--paper:#101315;--line:#303638;--accent:#a4d7ca;--blue:#a4d7ca}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit}a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.skip{position:absolute;top:-100px;left:20px;background:var(--paper);padding:15px;z-index:10}.skip:focus{top:10px}.wrap{max-width:1440px;margin:auto;padding:0 60px}header{background:var(--paper);border-bottom:1px solid var(--line)}nav{min-height:90px;display:flex;align-items:center;justify-content:space-between;gap:28px}.brand{text-decoration:none;font-size:1rem;font-weight:600;letter-spacing:-.025em}.brand span{color:var(--accent)}.links{display:flex;gap:30px}.links a{text-decoration:none;color:var(--muted);font-size:.88rem;transition:color .2s}.links a:hover{color:var(--ink)}.hero{padding:65px 0 0}.eyebrow{font: .72rem/1.5 ui-monospace,Consolas,monospace;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);margin:0 0 30px}h1{font-size:clamp(3rem,8.5vw,8rem);font-weight:500;line-height:1.04;letter-spacing:-.065em;margin:0 0 24px;max-width:850px}.hero h1 span{color:var(--accent)}.hero-layout{display:grid;grid-template-columns:1.35fr 1fr;gap:75px;align-items:center}.hero-subtitle{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--muted);letter-spacing:-.025em;margin:0}.intro{color:var(--muted);font-size:1rem;max-width:430px;margin:0 0 5px}.hero-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:25px 0 24px;margin-top:25px}.hero-bottom p{margin:0;color:var(--muted);font-size:.75rem;letter-spacing:.06em}.hero-bottom a{font-size:.9rem;color:var(--accent);text-underline-offset:6px}main{min-height:65vh}.section{padding-top:35px;padding-bottom:80px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:25px;margin-bottom:24px}h2{font-size:2.7rem;font-weight:500;letter-spacing:-.04em;line-height:1.2;margin:0 0 24px}.section-head h2{margin:0}.small{color:var(--muted);font-size:.8rem}.grid{display:flex;flex-direction:column}.card{display:grid;grid-template-columns:68px 1fr 230px;column-gap:24px;text-decoration:none;border-top:1px solid var(--line);padding:28px 0;transition:padding .25s,background .25s}.card:last-child{border-bottom:1px solid var(--line)}.card:hover{padding-left:16px;padding-right:16px;background:#171c1e}.card-top{display:contents}.card-top>span:first-child{grid-column:3;grid-row:1;color:var(--muted);font-size:.8rem;text-align:right}.number{grid-column:1;grid-row:1;color:var(--accent);font: .8rem/1.6 ui-monospace,Consolas,monospace;padding-top:7px}.card h3{grid-column:2;grid-row:1;font-size:clamp(1.15rem,2.3vw,2rem);font-weight:500;letter-spacing:-.035em;line-height:1.35;margin:0 0 10px}.card p{display:none;grid-column:2;grid-row:2;margin:0 0 16px;color:var(--muted);font-size:.9rem;max-width:660px}.tags{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted)}.card .tags{grid-column:2;grid-row:2}.tag{font-size:.75rem}.tag+.tag:before{content:' / ';color:#687572;margin-right:12px}.card-bottom{grid-column:3;grid-row:2 / 4;display:flex;flex-direction:column;align-items:end;justify-content:end;gap:16px;font-size:.75rem;color:var(--muted)}.card-bottom strong{font-weight:400;color:var(--accent)}.about{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 2fr;gap:80px;padding-top:55px}.about p{color:var(--muted);max-width:700px;margin:0 0 20px}.about a{color:var(--accent);text-underline-offset:6px}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:.75rem}.footer-row{display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}.back{display:inline-block;margin:40px 0;color:var(--accent);font-size:.85rem;text-underline-offset:6px}.detail-head{padding:25px 0 40px;border-bottom:1px solid var(--line)}.detail-head h1{font-size:clamp(2.5rem,5vw,4.5rem);margin-top:25px;max-width:940px}.detail-head p{color:var(--muted);max-width:800px;font-size:1.1rem;margin-bottom:28px}.detail-columns{display:grid;grid-template-columns:1.7fr 1fr;gap:90px;padding:50px 0 65px}.detail-columns h2{font-size:1.35rem}.work{padding-left:20px;color:var(--muted)}.work li{margin-bottom:18px;padding-left:5px}.note{border-left:1px solid var(--line);padding-left:30px}.note p{color:var(--muted);margin:0}.media{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;margin-bottom:30px}figure{margin:0}figure img{width:100%;max-height:640px;object-fit:contain;background:#171c1e;display:block}figcaption{color:var(--muted);font-size:.85rem;margin-top:10px}video,iframe{width:100%;aspect-ratio:16/9;border:0;background:#171c1e}.file-list{display:flex;gap:15px;flex-wrap:wrap;margin:25px 0 60px}.file-list a{border:1px solid var(--line);padding:12px 20px;text-underline-offset:4px}.empty-media{border-top:1px solid var(--line);padding:25px 0 55px;color:var(--muted);font-size:.9rem}.error{padding:70px 0}article{animation:arrive .35s ease-out}@keyframes arrive{from{opacity:.5;transform:translateY(7px)}to{opacity:1;transform:none}}@media(max-width:800px){.wrap{padding:0 24px}.hero{padding-top:55px}.hero-layout{grid-template-columns:1fr;gap:30px}.hero-bottom{margin-top:25px}.card{grid-template-columns:38px 1fr;gap:0 14px}.card-top>span:first-child{grid-column:2;grid-row:1;text-align:left;margin-bottom:8px}.number{grid-row:1 / 3}.card h3{grid-row:2}.card p{grid-row:3}.card .tags{grid-row:4}.card-bottom{grid-column:2;grid-row:5;flex-direction:row;justify-content:space-between;align-items:center;margin-top:18px}.about,.detail-columns{grid-template-columns:1fr;gap:28px}.note{padding-left:20px}.links{gap:18px}nav{flex-wrap:wrap;padding:20px 0;gap:14px}.section-head{align-items:start}.section-head h2{font-size:1.5rem}.hero-bottom p{max-width:160px}.hero-bottom a{white-space:nowrap}.media{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}article{animation:none}.card,.links a{transition:none}}
.video-gallery video{aspect-ratio:478/850;max-height:580px;object-fit:contain}.video-gallery{gap:30px}.video-gallery figure{background:#171c1e;padding:18px}.video-gallery figcaption{padding:4px 0 0}.media:has(>figure:only-child){grid-template-columns:minmax(0,440px)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><nav class="wrap" aria-label="Main navigation"><a class="brand" href="#">Shubham Jadhav<span>.</span></a><div class="links"><a href="#projects">Projects</a><a href="#about">About</a><a href="https://www.linkedin.com/in/shubham~jadhav/" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="https://github.com/jadhavshubham560" target="_blank" rel="noopener noreferrer">GitHub</a></div></nav></header>
<main id="main"><div class="wrap error" role="status">Loading projects…</div></main>
<footer><div class="wrap footer-row"><span>Shubham Jadhav · Mechanical engineering portfolio</span><a href="https://www.linkedin.com/in/shubham~jadhav/">Connect on LinkedIn</a></div></footer>
<script>
'use strict';
const main = document.getElementById('main');
let projects = [];
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const tags = p => p.tools.map(t => `<span class="tag">${esc(t)}</span>`).join('');
function safeUrl(value) {
  if (!value || typeof value !== 'string') return '';
  try { const url = new URL(value, location.href); return ['https:','http:'].includes(url.protocol) ? url.href : ''; } catch { return ''; }
}
function home() {
  document.title = 'Shubham Jadhav | Mechanical engineering portfolio';
  main.innerHTML = `<section class="hero"><div class="wrap"><p class="eyebrow">Mechanical engineering / Portfolio 2026</p><div class="hero-layout"><div><h1>Shubham<br>Jadhav<span>.</span></h1><p class="hero-subtitle">Mechanical design. Real-world testing.</p></div><p class="intro">I’m a mechanical engineer studying for my M.Eng. at Technische Hochschule Brandenburg. These projects cover mechanical design, material selection, robotics and embedded systems.</p></div><div class="hero-bottom"><p>SolidWorks · Ansys Granta · Robotics</p><a href="#projects">Explore my projects</a></div></div></section><section id="projects" class="wrap section"><div class="section-head"><h2>Selected projects</h2><span class="small">${projects.length} projects · 2026</span></div><div class="grid">${projects.map((p,i) => `<a class="card" href="#project/${encodeURIComponent(p.id)}"><div class="card-top"><span>${esc(p.category)}</span><span class="number">${String(i+1).padStart(2,'0')}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="tags">${tags(p)}</div><div class="card-bottom"><span>${esc(p.period)}</span><strong>View project</strong></div></a>`).join('')}</div></section><section id="about" class="wrap section about"><h2>About me</h2><div><p>I’m an early-career mechanical engineer with a background in industrial engineering. My interests include product development, CAD, testing and validation.</p><p>I’m completing an M.Eng. in Mechanical Engineering at Technische Hochschule Brandenburg, following an M.Sc. in Industrial Engineering and International Management at Hochschule Fresenius.</p><a href="https://www.linkedin.com/in/shubham~jadhav/" target="_blank" rel="noopener noreferrer">See my experience and education on LinkedIn</a></div></section>`;
}
function detail(p) {
  document.title = `${p.title} | Shubham Jadhav`;
  const images = (p.images || []).map(image => {const url=safeUrl(image.src); return url ? `<figure><img src="${esc(url)}" alt="${esc(image.alt || p.title)}" loading="lazy">${image.caption ? `<figcaption>${esc(image.caption)}</figcaption>` : ''}</figure>` : '';}).join('');
  const renderVideo = item => {
  const url=safeUrl(item.src);
  let video='';
  if(url) {
    const parsed=new URL(url);
    if(['www.youtube.com','youtube.com','www.youtube-nocookie.com'].includes(parsed.hostname) && /^\/embed\/[a-zA-Z0-9_-]+$/.test(parsed.pathname)) video=`<iframe src="${esc(url)}" title="${esc(p.title)} demonstration" loading="lazy" allowfullscreen></iframe>`;
    else if(/\.mp4$/i.test(parsed.pathname)) video=`<video controls playsinline preload="metadata" aria-label="${esc(item.title || p.title+' demonstration')}"><source src="${esc(url)}" type="video/mp4">Your browser does not support this video. <a href="${esc(url)}">Open the video</a>.</video>`;
    else video=`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Watch project demonstration</a>`;
  }
  return video ? `<figure>${video}${item.title ? `<figcaption>${esc(item.title)}</figcaption>` : ''}</figure>` : '';
  };
  const videoItems=p.videos || (p.video ? [{src:p.video}] : []);
  const video=videoItems.map(renderVideo).join('');
  const files=(p.files || []).map(file=>{const url=safeUrl(file.url);return url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(file.label)}</a>`:'';}).join('');
  main.innerHTML=`<div class="wrap"><a class="back" href="#projects">All projects</a><article><div class="detail-head"><span class="small">${esc(p.category)} · ${esc(p.period)}</span><h1>${esc(p.title)}</h1><p>${esc(p.summary)}</p>${p.team ? `<p class="small">Team: ${esc(p.team)}</p>` : ''}<div class="tags">${tags(p)}</div></div><div class="detail-columns"><section><h2>Project work</h2><ul class="work">${p.work.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></section><aside class="note"><h2>Engineering focus</h2><p>${esc(p.focus)}</p>${p.limitations ? `<h2 style="margin-top:28px">Limitations</h2><p>${esc(p.limitations)}</p>` : ''}</aside></div>${images || video || files ? `<section><h2>Project material</h2>${video ? `<div class="media video-gallery">${video}</div>`:''}${images ? `<div class="media">${images}</div>`:''}${files ? `<div class="file-list">${files}</div>`:''}</section>` : '<p class="empty-media">Project videos, drawings and supporting files will be added here.</p>'}</article></div>`;
}
function route() {
  if(location.hash.startsWith('#project/')) {
    const id=location.hash.slice(9);
    const p=projects.find(p=>encodeURIComponent(p.id)===id);
    if(p) detail(p); else {document.title='Project not found | Shubham Jadhav';main.innerHTML='<div class="wrap error"><h1>Project not found</h1><a href="#projects">Return to projects</a></div>';}
    window.scrollTo(0,0);
  } else {
    home();
    if(['#projects','#about'].includes(location.hash)) document.querySelector(location.hash).scrollIntoView();
    else window.scrollTo(0,0);
  }
}
fetch('projects.json').then(response=>{if(!response.ok)throw new Error('Projects unavailable');return response.json();}).then(data=>{if(!Array.isArray(data))throw new Error('Invalid project data');projects=data;route();window.addEventListener('hashchange',route);}).catch(()=>{main.innerHTML='<div class="wrap error"><h1>Projects are unavailable right now.</h1><p>Please try again later, or visit <a href="https://www.linkedin.com/in/shubham~jadhav/">my LinkedIn profile</a>.</p></div>';});
</script>
</body>
</html>
